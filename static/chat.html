<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fundavia - KI Berater</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1326; color: #dae2fd; margin: 0; padding: 0; display: flex; height: 100vh; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 800px; padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { margin: 0; color: #3b82f6; font-size: 24px; }
        .chat-container { flex: 1; width: 100%; max-width: 800px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 75%; padding: 14px 18px; border-radius: 20px; font-size: 15px; line-height: 1.5; }
        .agent { background: #1e3a8a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: #374151; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .input-area { width: 100%; max-width: 800px; padding: 20px; display: flex; gap: 10px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.1); }
        input[type="text"] { flex: 1; padding: 15px; border-radius: 30px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #3b82f6; }
        button { background: #3b82f6; color: white; border: none; padding: 0 25px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .results-container { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid rgba(16,185,129,0.3); }
        .result-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #10b981; }
        .result-card h3 { margin: 0 0 5px 0; color: #fff; }
        .result-card p { margin: 0; color: #94a3b8; font-size: 13px; font-style: italic; }
        .typing { font-style: italic; color: #94a3b8; align-self: flex-start; margin-left: 10px; display: none; }
    </style>
</head>
<body>
    <a href="/" class="back-btn" style="position: absolute; left: 20px; top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px; transition: 0.2s;">&larr; Zurück</a>
    <div class="header">
        <h1>Fundavia KI-Förderberater</h1>
    </div>
    
    <div class="chat-container" id="chat">
        <!-- Messages go here -->
    </div>
    <div class="typing" id="typing">🤖 Berater tippt...</div>
    
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Schreiben Sie hier..." onkeypress="if(event.key === 'Enter') sendMsg()">
        <button onclick="sendMsg()">Senden</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg-input');
        const typing = document.getElementById('typing');
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat`);

        ws.onmessage = (event) => {
            typing.style.display = 'none';
            const data = JSON.parse(event.data);
            
            if (data.role === "agent") {
                appendBubble(data.text, "agent");
            } else if (data.role === "results") {
                renderResults(data.data);
            }
        };

        function sendMsg() {
            const text = input.value.trim();
            if (!text) return;
            appendBubble(text, "user");
            ws.send(text);
            input.value = '';
            typing.style.display = 'block';
        }

        function appendBubble(text, sender) {
            const div = document.createElement('div');
            div.className = `bubble ${sender}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function renderResults(resultsData) {
            const container = document.createElement('div');
            container.className = 'results-container';
            container.innerHTML = `<h2 style="margin-top:0; color:#10b981;">✅ Profil komplett! Ich habe ${resultsData.results.length} Programme gefunden:</h2>`;
            
            resultsData.results.forEach(r => {
                container.innerHTML += `
                    <div class="result-card">
                        <h3>${r.Programm_Name} (max. €${r.Max_Foerderung_EUR || 'Variabel'})</h3>
                        <p>${r.Explanation}</p>
                    </div>
                `;
            });
            chat.appendChild(container);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
