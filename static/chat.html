<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fundavia - KI Berater</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1326; color: #dae2fd; margin: 0; padding: 0; display: flex; height: 100vh; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 800px; padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { margin: 0; color: #3b82f6; font-size: 24px; }
        .chat-container { flex: 1; width: 100%; max-width: 800px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 75%; padding: 14px 18px; border-radius: 20px; font-size: 15px; line-height: 1.5; }
        .agent { background: #1e3a8a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: #374151; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .input-area { width: 100%; max-width: 800px; padding: 20px; display: flex; gap: 10px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.1); }
        input[type="text"] { flex: 1; padding: 15px; border-radius: 30px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #3b82f6; }
        button { background: #3b82f6; color: white; border: none; padding: 0 25px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .results-container { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 14px; margin-top: 15px; border: 1px solid rgba(16,185,129,0.3); }
        .result-card { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #10b981; }
        .result-card h3 { margin: 0 0 6px 0; color: #fff; font-size: 16px; }
        .result-card .meta { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        .result-card p { margin: 0; color: #cbd5e1; font-size: 13.5px; line-height: 1.4; font-style: italic; }
        .typing { font-style: italic; color: #94a3b8; align-self: flex-start; margin-left: 10px; display: none; }
    </style>
</head>
<body>
    <a href="/" class="back-btn" style="position: absolute; left: 20px; top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px; transition: 0.2s;">&larr; Zurück</a>
    <div class="header">
        <h1>Fundavia KI-Förderberater</h1>
    </div>
    
    <div class="chat-container" id="chat">
        <!-- Messages go here -->
    </div>
    <div class="typing" id="typing">🤖 Berater tippt...</div>
    
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Schreiben Sie hier..." onkeypress="if(event.key === 'Enter') sendMsg()">
        <button onclick="sendMsg()">Senden</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg-input');
        const typing = document.getElementById('typing');
        let sessionId = localStorage.getItem("fundavia_session");
        if (!sessionId) { 
            sessionId = Math.random().toString(36).substring(2) + Date.now().toString(36); 
            localStorage.setItem("fundavia_session", sessionId); 
        }
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat?session_id=${sessionId}`);

        ws.onmessage = (event) => {
            typing.style.display = 'none';
            const data = JSON.parse(event.data);
            
            if (data.role === "agent" && data.text) {
                appendBubble(data.text, "agent");
            }
            if (data.role === "results" || data.status === "success" || data.results) {
                renderResults(data.data || data);
            }
        };

        function sendMsg() {
            const text = input.value.trim();
            if (!text) return;
            appendBubble(text, "user");
            ws.send(text);
            input.value = '';
            typing.style.display = 'block';
        }

        function appendBubble(text, sender) {
            const div = document.createElement('div');
            div.className = `bubble ${sender}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function renderResults(resultsData) {
            const container = document.createElement('div');
            container.className = 'results-container';
            const items = resultsData.results || resultsData || [];
            container.innerHTML = `<h2 style="margin-top:0; color:#10b981; font-size:18px;">✅ Profil komplett! Ich habe ${items.length} verifizierte Förderprogramme gefunden:</h2>`;
            
            items.forEach(r => {
                const name = r.name || r.Programm_Name || 'Förderprogramm';
                const maxEur = (r.max_amount_eur || r.Max_Foerderung_EUR) ? 'Max. €' + Number(r.max_amount_eur || r.Max_Foerderung_EUR).toLocaleString('de-DE') : 'Variabel';
                const rate = r.funding_pct ? `${r.funding_pct}%` : '';
                const expl = r.explanation || r.Explanation || r.description || '';
                const provider = r.provider || r.Foerdergeber || 'Bundesförderung';
                
                container.innerHTML += `
                    <div class="result-card">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <h3 style="margin: 0; color: #fff;">${name}</h3>
                            <span style="color: #3b82f6; font-weight: bold; font-size: 16px;">${rate}</span>
                        </div>
                        <div class="meta">${provider} &bull; ${maxEur}</div>
                        <p>${expl}</p>
                    </div>
                `;
            });
            chat.appendChild(container);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
